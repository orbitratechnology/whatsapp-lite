[package]
name = "whatsapp-lite"
version = "0.1.0"
description = "A lightweight Tauri wrapper for WhatsApp Web"
authors = ["Orbitra Tech"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "whatsapp_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
